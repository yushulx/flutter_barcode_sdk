name: flutter_barcode_sdk_android
resolution: workspace
description: Android platform implementation of flutter_barcode_sdk.
version: 1.0.1
repository: https://github.com/yushulx/flutter_barcode_sdk_android

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_barcode_sdk
    platforms:
      android:
        package: com.dynamsoft.flutter_barcode_sdk
        pluginClass: FlutterBarcodeSdkPlugin
