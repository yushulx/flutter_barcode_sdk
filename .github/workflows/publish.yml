# .github/workflows/publish.yml
# Manual, token-based publishing for the flutter_barcode_sdk monorepo.
#
# Publishing normally happens from a developer machine:
#
#   cd packages/<package> && dart pub publish
#
# There is deliberately NO tag trigger. Tagging a release (e.g.
# `flutter_barcode_sdk-v5.3.2`) used to start this workflow, but the pub
# client never completes the OIDC exchange in this repository: it skips
# OIDC entirely and falls back to an interactive Google login that a
# headless runner can never finish, so every tag produced a run that hung
# until it was cancelled. Do not re-add a `push: tags:` trigger until that
# is fixed upstream.
#
# What remains is a manual escape hatch for when the repository secret
# `PUB_PUBLISH_AUTH_TOKEN` (create one at https://pub.dev/tokens) exists.
# Without that secret the job fails immediately with instructions instead
# of hanging on the login prompt.
name: Publish to pub.dev

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory under packages/ (e.g. flutter_barcode_sdk_web)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Kept for OIDC, in case the client-side issue is fixed
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve package directory
        id: package
        run: |
          PACKAGE="${{ inputs.package }}"
          # Validate that the package exists.
          if [ ! -f "packages/${PACKAGE}/pubspec.yaml" ]; then
            echo "::error::Package '${PACKAGE}' not found under packages/"
            exit 1
          fi
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        working-directory: packages/${{ steps.package.outputs.package }}
        run: flutter pub get

      - name: Analyze
        working-directory: packages/${{ steps.package.outputs.package }}
        run: flutter analyze

      # Fail fast instead of waiting forever on the interactive login prompt.
      - name: Check publishing credentials
        env:
          PUB_PUBLISH_AUTH_TOKEN: ${{ secrets.PUB_PUBLISH_AUTH_TOKEN }}
        run: |
          if [ -z "${PUB_PUBLISH_AUTH_TOKEN}" ]; then
            echo "::error::PUB_PUBLISH_AUTH_TOKEN is not configured."
            echo "Publish from a developer machine instead:"
            echo "  cd packages/${{ steps.package.outputs.package }} && dart pub publish"
            exit 1
          fi

      # The pub client only reads a token from an environment variable after
      # it has been registered under that name in its credentials store.
      - name: Register the publish token
        env:
          PUB_PUBLISH_AUTH_TOKEN: ${{ secrets.PUB_PUBLISH_AUTH_TOKEN }}
        run: dart pub token add https://pub.dev --env-var PUB_PUBLISH_AUTH_TOKEN

      - name: Publish to pub.dev
        working-directory: packages/${{ steps.package.outputs.package }}
        env:
          PUB_PUBLISH_AUTH_TOKEN: ${{ secrets.PUB_PUBLISH_AUTH_TOKEN }}
        run: dart pub publish --force
